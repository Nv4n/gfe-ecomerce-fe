<form class="flex flex-col" [formGroup]="newsletterForm" (ngSubmit)="onSubmit()">
	<label for="email" class="sr-only">Newsletter email</label>
	<div class="flex gap-4">
		<input
			id="email"
			placesholder="Enter your email"
			class="w-67.5 px-3.5 py-2.5"
			formControlName="email"
			type="email"
			required
			pInputText
		/>
		<button
			class="bg-brand-primary px-3.5 py-2.5 text-sm"
			type="submit"
			pButton
			[disabled]="!newsletterForm.valid"
		>
			Subscribe
		</button>
	</div>
	<p-toast class="flex w-lg flex-col" position="top-center" key="top-center" />
	@if (
		newsletterForm.get('email')?.hasError('required') && newsletterForm.get('email')?.touched
	) {
		<span class="text-red-600">Email is required</span>
	} @else if (
		newsletterForm.get('email')?.hasError('email') && newsletterForm.get('email')?.touched
	) {
		<span class="text-red-600">Please enter a valid email address.</span>
	}
</form>
