<form class="flex gap-4" [formGroup]="newsletterForm" (ngSubmit)="onSubmit()">
	<label for="email" class="sr-only"></label>
	<div>
		<input
			id="email"
			placesholder="Enter your email"
			class="px-3.5 py-2.5"
			formControlName="email"
			type="email"
			required
		/>
		@if (newsletterForm.controls.email) {}
	</div>

	<button
		class="bg-brand-primary px-3.5 py-2.5 text-sm"
		type="submit"
		pButton
		[disabled]="!newsletterForm.valid"
	>
		Subscribe
	</button>
</form>
